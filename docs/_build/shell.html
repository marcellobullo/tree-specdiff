<title>specdiff — documentation</title>
<style>
  /* ---------------------------------------------------------------- tokens */
  :root {
    /* neutrals carry a green-blue bias toward the accent, not a flat grey */
    --ground:   #FBFCFC;
    --surface:  #F2F5F4;
    --raised:   #FFFFFF;
    --border:   #E2E9E7;
    --border-2: #D6DEDB;
    --ink:      #16201E;
    --ink-2:    #414F4B;
    --muted:    #6B7B77;
    --accent:   #136F63;   /* accept */
    --accent-2: #0E524A;
    --accent-w: #E4F0EE;
    --clay:     #A65A3A;   /* reject */
    --clay-w:   #F6EBE5;
    --shadow:   0 1px 2px rgba(16,32,30,.05), 0 8px 24px -12px rgba(16,32,30,.18);

    --serif: ui-serif, "Iowan Old Style", Charter, "Palatino Linotype", Palatino, Georgia, serif;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;

    --measure: 68ch;
    --sidebar: 16.5rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0E1413; --surface:#151D1B; --raised:#18211F;
      --border:#243230; --border-2:#2E403C;
      --ink:#E6EDEB; --ink-2:#B7C4C0; --muted:#879793;
      --accent:#4FB3A4; --accent-2:#6FC9BB; --accent-w:#12312C;
      --clay:#D08A66; --clay-w:#33211A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0E1413; --surface:#151D1B; --raised:#18211F;
    --border:#243230; --border-2:#2E403C;
    --ink:#E6EDEB; --ink-2:#B7C4C0; --muted:#879793;
    --accent:#4FB3A4; --accent-2:#6FC9BB; --accent-w:#12312C;
    --clay:#D08A66; --clay-w:#33211A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
  :root[data-theme="light"] {
    --ground:#FBFCFC; --surface:#F2F5F4; --raised:#FFFFFF;
    --border:#E2E9E7; --border-2:#D6DEDB;
    --ink:#16201E; --ink-2:#414F4B; --muted:#6B7B77;
    --accent:#136F63; --accent-2:#0E524A; --accent-w:#E4F0EE;
    --clay:#A65A3A; --clay-w:#F6EBE5;
    --shadow: 0 1px 2px rgba(16,32,30,.05), 0 8px 24px -12px rgba(16,32,30,.18);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: .18em; }
  a:hover { text-decoration-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  /* ---------------------------------------------------------------- masthead */
  .masthead {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 1rem;
    padding: .7rem clamp(1rem, 3vw, 2rem);
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-family: var(--mono); font-size: .95rem; font-weight: 600; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
  .brand span { color: var(--accent); }
  .tagline { font-size: .8rem; color: var(--muted); border-left: 1px solid var(--border-2); padding-left: 1rem; }
  .mh-right { margin-left: auto; display: flex; align-items: center; gap: .5rem; }
  .btn {
    font: inherit; font-size: .8rem; color: var(--ink-2);
    background: var(--raised); border: 1px solid var(--border-2); border-radius: 6px;
    padding: .35rem .6rem; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  #search {
    font: inherit; font-size: .82rem; width: 13rem; color: var(--ink);
    background: var(--raised); border: 1px solid var(--border-2); border-radius: 6px;
    padding: .35rem .6rem;
  }
  #search::placeholder { color: var(--muted); }
  #navtoggle { display: none; }

  /* ---------------------------------------------------------------- layout */
  .shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3.5rem); max-width: 84rem; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2rem); align-items: start; }
  .sidebar { position: sticky; top: 3.4rem; max-height: calc(100vh - 4rem); overflow-y: auto; padding: 1.75rem 0 3rem; display: flex; flex-direction: column; gap: .25rem; }
  .nav-group { display: flex; flex-direction: column; }
  .nav-doc { display: flex; flex-direction: column; gap: .1rem; padding: .5rem .6rem; border-radius: 7px; text-decoration: none; border-left: 2px solid transparent; }
  .nav-doc:hover { background: var(--surface); }
  .nav-title { font-size: .875rem; font-weight: 600; color: var(--ink-2); }
  .nav-blurb { font-size: .74rem; color: var(--muted); line-height: 1.4; }
  .nav-group.active .nav-doc { border-left-color: var(--accent); background: var(--accent-w); }
  .nav-group.active .nav-title { color: var(--accent); }
  .toc { display: none; flex-direction: column; margin: .15rem 0 .6rem; padding-left: .65rem; border-left: 1px solid var(--border); }
  .nav-group.active .toc { display: flex; }
  .toc-item { font-size: .78rem; color: var(--muted); text-decoration: none; padding: .2rem .5rem; border-radius: 5px; line-height: 1.4; }
  .toc-item.lvl3 { padding-left: 1.15rem; font-size: .75rem; }
  .toc-item:hover { color: var(--accent); background: var(--surface); }
  .toc-item.here { color: var(--accent); font-weight: 600; }

  main { padding: 2rem 0 6rem; min-width: 0; }
  .pane { display: none; max-width: var(--measure); }
  .pane.on { display: block; }

  /* ---------------------------------------------------------------- prose */
  .hd { font-family: var(--serif); font-weight: 600; text-wrap: balance; letter-spacing: -.012em; position: relative; }
  .hd-1 { font-size: clamp(2rem, 4.4vw, 2.7rem); line-height: 1.12; margin: .2rem 0 1.4rem; }
  .hd-2 { font-size: 1.55rem; line-height: 1.22; margin: 3.2rem 0 .5rem; padding-top: 1.4rem; border-top: 1px solid var(--border); }
  .hd-3 { font-size: 1.16rem; line-height: 1.3; margin: 2.2rem 0 .4rem; }
  .hd-4 { font-size: 1rem; margin: 1.6rem 0 .3rem; font-family: var(--sans); }
  .anchor { position: absolute; left: -1.15rem; color: var(--border-2); text-decoration: none; opacity: 0; font-family: var(--mono); font-weight: 400; }
  .hd:hover .anchor { opacity: 1; }
  .anchor:hover { color: var(--accent); }

  main p { margin: 0 0 1.05rem; color: var(--ink-2); }
  main li { color: var(--ink-2); margin: .3rem 0; }
  main ul, main ol { padding-left: 1.3rem; margin: 0 0 1.05rem; }
  main strong { color: var(--ink); font-weight: 650; }
  main em { color: var(--ink-2); }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }

  code {
    font-family: var(--mono); font-size: .855em;
    background: var(--surface); border: 1px solid var(--border);
    padding: .08em .34em; border-radius: 4px; color: var(--ink);
    word-break: break-word;
  }
  pre {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: .95rem 1.1rem; overflow-x: auto; margin: 0 0 1.2rem; line-height: 1.55;
  }
  pre code { background: none; border: 0; padding: 0; font-size: .82rem; }

  blockquote { margin: 0 0 1.2rem; padding: .1rem 0 .1rem 1rem; border-left: 3px solid var(--clay); color: var(--muted); }

  .tw { overflow-x: auto; margin: 0 0 1.3rem; border: 1px solid var(--border); border-radius: 9px; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { text-align: left; padding: .55rem .8rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--surface); font-weight: 650; color: var(--ink); white-space: nowrap; font-size: .78rem; letter-spacing: .02em; text-transform: uppercase; }
  tr:last-child td { border-bottom: 0; }
  td code { white-space: nowrap; }
  td:first-child { font-variant-numeric: tabular-nums; }

  input[type="checkbox"] { accent-color: var(--accent); }

  .mermaid-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 1.1rem; margin: 0 0 1.3rem; display: flex; justify-content: center; }
  pre.mermaid { background: none; border: 0; padding: 0; margin: 0; overflow: visible; }
  .srclink { font-family: var(--mono); font-size: .855em; background: var(--surface); border: 1px solid var(--border); padding: .08em .34em; border-radius: 4px; color: var(--muted); }

  /* ---------------------------------------------------------------- search */
  .results { position: absolute; top: 3.1rem; right: clamp(1rem, 3vw, 2rem); width: min(30rem, calc(100vw - 2rem)); background: var(--raised); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; display: none; z-index: 50; padding: .35rem; }
  .results.on { display: block; }
  .res { display: flex; flex-direction: column; gap: .05rem; padding: .45rem .6rem; border-radius: 7px; text-decoration: none; }
  .res:hover, .res.sel { background: var(--accent-w); }
  .res-x { font-size: .85rem; color: var(--ink); font-weight: 550; }
  .res-t { font-size: .72rem; color: var(--muted); }
  .res-none { padding: .8rem .6rem; font-size: .82rem; color: var(--muted); }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { position: fixed; inset: 3.2rem 0 auto; z-index: 30; background: var(--ground); border-bottom: 1px solid var(--border); padding: 1rem clamp(1rem,3vw,2rem) 1.5rem; max-height: calc(100vh - 3.2rem); display: none; }
    .sidebar.open { display: flex; }
    #navtoggle { display: inline-flex; }
    .tagline { display: none; }
    #search { width: 8.5rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<header class="masthead">
  <a class="brand" href="#overview">spec<span>diff</span></a>
  <span class="tagline">speculative diffusion sampling over draft trees</span>
  <div class="mh-right">
    <input id="search" type="search" placeholder="Search docs  /" autocomplete="off" aria-label="Search documentation" />
    <button class="btn" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
    <button class="btn" id="navtoggle" aria-label="Toggle navigation">☰</button>
  </div>
  <div class="results" id="results" role="listbox"></div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar"><!--NAV--></nav>
  <main id="main"><!--PANES--></main>
</div>

<script>
  const INDEX = /*INDEX*/;
  const panes = [...document.querySelectorAll('.pane')];
  const groups = [...document.querySelectorAll('.nav-group')];

  function show(slug, anchor) {
    const target = panes.find(p => p.dataset.slug === slug) || panes[0];
    panes.forEach(p => p.classList.toggle('on', p === target));
    groups.forEach(g => g.classList.toggle('active', g.dataset.slug === target.dataset.slug));
    document.getElementById('sidebar').classList.remove('open');
    if (anchor) {
      const el = document.getElementById(anchor);
      if (el) { el.scrollIntoView({ block: 'start' }); window.scrollBy(0, -70); return; }
    }
    window.scrollTo(0, 0);
  }

  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return show('overview');
    const slug = panes.map(p => p.dataset.slug).find(s => h === s || h.startsWith(s + '--'));
    slug ? show(slug, h.includes('--') ? h : null) : show('overview');
  }
  addEventListener('hashchange', route);
  route();

  // active section highlighting
  const spy = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      document.querySelectorAll('.toc-item.here').forEach(i => i.classList.remove('here'));
      const link = document.querySelector(`.toc-item[href="#${CSS.escape(e.target.id)}"]`);
      if (link) link.classList.add('here');
    });
  }, { rootMargin: '-70px 0px -75% 0px' });
  document.querySelectorAll('.hd-2, .hd-3').forEach(h => spy.observe(h));

  // theme toggle
  const root = document.documentElement;
  document.getElementById('theme').onclick = () => {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur = root.dataset.theme || (dark ? 'dark' : 'light');
    root.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  };

  // search over section headings
  const box = document.getElementById('search'), results = document.getElementById('results');
  let sel = 0, hits = [];
  function render() {
    if (!hits.length) { results.innerHTML = '<div class="res-none">No matching sections.</div>'; return; }
    results.innerHTML = hits.map((h, i) =>
      `<a class="res${i === sel ? ' sel' : ''}" href="#${h.i}"><span class="res-x">${h.x}</span><span class="res-t">${h.t}</span></a>`
    ).join('');
  }
  box.addEventListener('input', () => {
    const q = box.value.trim().toLowerCase();
    if (!q) { results.classList.remove('on'); return; }
    hits = [];
    INDEX.forEach(d => d.h.forEach(h => {
      if (h.x.toLowerCase().includes(q)) hits.push({ i: h.i, x: h.x, t: d.t });
    }));
    hits = hits.slice(0, 12); sel = 0; render(); results.classList.add('on');
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') { box.blur(); results.classList.remove('on'); }
    if (!hits.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % hits.length; render(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + hits.length) % hits.length; render(); }
    if (e.key === 'Enter') { e.preventDefault(); location.hash = hits[sel].i; box.blur(); results.classList.remove('on'); }
  });
  addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== box) { e.preventDefault(); box.focus(); }
  });
  document.addEventListener('click', e => {
    if (!results.contains(e.target) && e.target !== box) results.classList.remove('on');
    if (e.target.closest('.res')) { results.classList.remove('on'); box.value = ''; }
  });
  document.getElementById('navtoggle').onclick = () =>
    document.getElementById('sidebar').classList.toggle('open');
</script>
