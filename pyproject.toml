[project]
name = "specdiff"
version = "0.1.0"
description = "Speculative diffusion sampling over arbitrary draft trees"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
torch = ["torch>=2.0"]
dev = ["numpy>=1.24", "pytest>=7"]
# experiments/images: pretrained EDM checkpoints, multi-GPU sharding.
edm = ["torch>=2.0", "accelerate>=0.26", "pillow", "diffusers>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["specdiff*"]
